# Fly.io deployment configuration for Yehia Wael Portfolio
app = "yehia-portfolio"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "portfolio_data"
  destination = "/app/data"
