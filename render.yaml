services:
  - type: web
    name: yehia-portfolio
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@yehia.dev
      - key: ADMIN_PASSWORD
        value: AdminPass123!
