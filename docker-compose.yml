services:
  yehia-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yehia-portfolio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET=yehia_production_secret_key_change_me_in_prod_2026
      - ADMIN_EMAIL=admin@yehia.dev
      - ADMIN_PASSWORD=AdminPass123!
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
